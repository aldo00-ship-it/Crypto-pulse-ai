<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Pulse AI Terminal Pro - Ultimate Edition V13 (Libre)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <link rel="manifest" href="manifest.json">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta+Sans', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #030712; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1f2937; border-radius: 3px; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen custom-scrollbar flex flex-col justify-between selection:bg-emerald-500 selection:text-black">

    <!-- MAIN APP CONTAINER (LIBRE D'ACCÈS) -->
    <div id="main-app" class="flex-1 flex flex-col">
        <!-- HEADER AVEC MENU DÉROULANT -->
        <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 sticky top-0 z-40 px-6 py-3.5 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-gradient-to-tr from-emerald-500 to-cyan-500 rounded-xl text-slate-950 font-black text-lg">⚡</div>
                <h1 class="text-base font-black tracking-wider bg-gradient-to-r from-emerald-400 via-cyan-400 to-indigo-400 bg-clip-text text-transparent">
                    CRYPTO PULSE AI <span class="text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full">V13 LIBRE</span>
                </h1>
            </div>

            <!-- MENU DÉROULANT DES FONCTIONS -->
            <div class="relative">
                <button onclick="toggleNavDropdown()" class="flex items-center space-x-2 bg-slate-950 border border-slate-800 hover:border-emerald-500/50 px-4 py-2.5 rounded-xl text-xs font-bold text-slate-200 transition shadow-lg">
                    <span id="current-tab-title" class="text-emerald-400">📊 Tracker Top 150</span>
                    <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>

                <!-- Dropdown Menu Box -->
                <div id="nav-dropdown-menu" class="hidden absolute right-0 mt-2 w-64 bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl py-2 z-50 text-xs space-y-1">
                    <button onclick="switchTab('tracker'); closeDropdown();" class="w-full text-left px-4 py-2.5 hover:bg-slate-800 text-slate-300 transition flex items-center space-x-2"><span>📊</span><span>Tracker Top 150</span></button>
                    <button onclick="switchTab('chart'); closeDropdown();" class="w-full text-left px-4 py-2.5 hover:bg-slate-800 text-slate-300 transition flex items-center space-x-2"><span>📈</span><span>Workspace Graphique</span></button>
                    <button onclick="switchTab('pepites'); closeDropdown();" class="w-full text-left px-4 py-2.5 hover:bg-slate-800 text-slate-300 transition flex items-center space-x-2"><span>💎</span><span>Pépites du Jour</span></button>
                    <button onclick="switchTab('analyzer'); closeDropdown();" class="w-full text-left px-4 py-2.5 hover:bg-slate-800 text-slate-300 transition flex items-center space-x-2"><span>🔍</span><span>Analyse IA 360°</span></button>
                    <button onclick="switchTab('live-tracking'); closeDropdown();" class="w-full text-left px-4 py-2.5 hover:bg-slate-800 text-slate-300 transition flex items-center space-x-2"><span>🔔</span><span>Suivi Positions & Alertes</span></button>
                    <button onclick="switchTab('correlation'); closeDropdown();" class="w-full text-left px-4 py-2.5 hover:bg-slate-800 text-slate-300 transition flex items-center space-x-2"><span>📉</span><span>Corrélation BTC</span></button>
                    <button onclick="switchTab('calculator'); closeDropdown();" class="w-full text-left px-4 py-2.5 hover:bg-slate-800 text-slate-300 transition flex items-center space-x-2"><span>🧮</span><span>Gestion du Risque</span></button>
                    <button onclick="switchTab('journal'); closeDropdown();" class="w-full text-left px-4 py-2.5 hover:bg-slate-800 text-slate-300 transition flex items-center space-x-2"><span>📓</span><span>Journal de Trade</span></button>
                    <button onclick="switchTab('sentiment'); closeDropdown();" class="w-full text-left px-4 py-2.5 hover:bg-slate-800 text-slate-300 transition flex items-center space-x-2"><span>⚡</span><span>News & Whales</span></button>
                    <button onclick="switchTab('chat'); closeDropdown();" class="w-full text-left px-4 py-2.5 hover:bg-slate-800 text-slate-300 transition flex items-center space-x-2"><span>🤖</span><span>GemCrypt AI Chat</span></button>
                </div>
            </div>
        </header>

        <!-- CONTENT AREA -->
        <main class="flex-1 p-6 max-w-7xl mx-auto w-full space-y-6">

            <!-- TAB 1: TRACKER TOP 150 -->
            <section id="tab-tracker" class="space-y-4">
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex justify-between items-center">
                    <input type="text" id="tracker-search" oninput="filterTracker()" placeholder="Rechercher un token..." class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white w-72 focus:outline-none focus:border-emerald-500">
                    <button onclick="loadTopCryptos()" class="px-4 py-2.5 bg-slate-800 text-xs rounded-xl font-semibold hover:bg-slate-700 transition">🔄 Actualiser</button>
                </div>
                <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-slate-950 text-slate-400 uppercase tracking-wider">
                                <tr><th class="p-4">Token</th><th class="p-4">Prix (USD)</th><th class="p-4">24h</th><th class="p-4">Market Cap</th></tr>
                            </thead>
                            <tbody id="crypto-table-body" class="divide-y divide-slate-800/60">
                                <tr><td colspan="4" class="p-8 text-center text-slate-500">Chargement des cryptos en direct...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>

            <!-- TAB 2: TRADINGVIEW WORKSPACE -->
            <section id="tab-chart" class="space-y-4 hidden">
                <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                    <select id="chart-symbol-select" onchange="updateTradingViewChart()" class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-xs text-emerald-400 font-bold focus:outline-none">
                        <option value="BINANCE:BTCUSDT">Bitcoin (BTC/USDT)</option>
                        <option value="BINANCE:ETHUSDT">Ethereum (ETH/USDT)</option>
                        <option value="BINANCE:SOLUSDT">Solana (SOL/USDT)</option>
                        <option value="BINANCE:ONDOUSDT">Ondo (ONDO/USDT)</option>
                    </select>
                </div>
                <div class="bg-slate-900 border border-slate-800 rounded-2xl p-2 h-[650px]" id="tradingview-container"></div>
            </section>

            <!-- TAB 3: PÉPITES DU JOUR -->
            <section id="tab-pepites" class="space-y-4 hidden">
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-2">
                    <h2 class="text-xl font-bold text-white">💎 Pépites & Opportunités du Jour</h2>
                    <p class="text-xs text-slate-400">Ondo Finance, Render Network et Pendle en surveillance active.</p>
                </div>
            </section>

            <!-- TAB 4: ANALYSE IA -->
            <section id="tab-analyzer" class="space-y-4 hidden">
                <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4">
                    <h2 class="text-xl font-bold text-white">🔍 Scanner & Analyseur Crypto 360°</h2>
                    <div class="flex gap-3">
                        <input type="text" id="analyzer-input" placeholder="Ex: RENDER..." class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm text-white focus:outline-none">
                        <button onclick="runAiAnalysis()" class="px-6 py-3 bg-emerald-500 text-slate-950 font-bold rounded-xl text-sm">Analyser</button>
                    </div>
                </div>
                <div id="analyzer-result" class="space-y-4 hidden"></div>
            </section>

            <!-- TAB 5: SUIVI LIVE -->
